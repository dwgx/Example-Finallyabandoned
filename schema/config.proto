syntax = "proto3";

package com.diaoling.schema;

import "datatypes.proto";

option java_package = "com.diaoling.schema.config";
option java_outer_classname = "ConfigSchema";

message BaseConfig {
    string name = 1;
    string description = 2;
    string creator = 3;
    string version = 4;
}

enum ModuleStatus {
    UNKNOWN_STATUS = 0;
    ACTIVE_STATUS = 1;
    ALWAY_ACTIVE_STATUS = 2;
    INACTIVE_STATUS = 3;
    ALWAY_INACTIVE_STATUS = 4;
    MAINTENANCE_STATUS = 5;
}

message SettingsConfig {
    BaseConfig base_config = 1;
    map<string, Type> settings = 2;
}

message ModuleConfig {
    SettingsConfig config = 1;
    string module_name = 2;
    int32 moduleKey = 3;
    ModuleStatus status = 4;
}

message ClientConfig {
    SettingsConfig config = 1;
    string client_version = 2;
}